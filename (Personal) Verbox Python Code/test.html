<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine - Verbox ♡ Scara</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #2a0a3d, #050010);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #ffd6f0;
      text-align: center;
    }

    .container {
      max-width: 900px;
      padding: 24px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 72px);
      margin-bottom: 12px;
      text-shadow: 0 0 20px #ff4fd8;
    }

    .desc {
      font-size: clamp(14px, 3.5vw, 22px);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .hearts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0 40px;
    }

    .hearts span {
      font-size: clamp(20px, 5vw, 40px);
      filter: drop-shadow(0 0 8px #ff5ca8);
    }

    .question {
      font-size: clamp(18px, 4vw, 28px);
      margin-bottom: 20px;
    }

    .tap {
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Verbox ♡ Scara</h1>

    <p class="desc">
      Makasih udah selalu ada. Semoga hari ini penuh senyum & cinta 💖  
      <br>
      No matter what, I'm grateful to have you. Happy Valentine 🌷
    </p>

    <div class="hearts">
      <span>💗</span><span>💗</span><span>💗</span><span>💗</span>
      <span>💗</span><span>💗</span><span>💗</span><span>💗</span>
    </div>

    <div class="question">
      Will you be my Valentine today? ❤️
    </div>

    <div class="tap">
      Tap / Klik layar 💖
    </div>
  </div>
</body>
</html>
